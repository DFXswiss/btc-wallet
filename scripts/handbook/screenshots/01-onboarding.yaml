appId: swiss.dfx.bitcoin
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: 'Wallet importieren'
    timeout: 60000
- takeScreenshot: shots/01-onboarding/01-start
- tapOn: 'Erstellen'
- extendedWaitUntil:
    visible: 'Jetzt überspringen'
    timeout: 60000
- takeScreenshot: shots/01-onboarding/02-lndhub-verbindung
- tapOn: 'Benutzerdefiniert'
- waitForAnimationToEnd:
    timeout: 4000
- takeScreenshot: shots/01-onboarding/03-lndhub-benutzerdefiniert
- tapOn: 'DFX.swiss'
- waitForAnimationToEnd:
    timeout: 4000
- takeScreenshot: shots/01-onboarding/04-lndhub-dfx-swiss
- tapOn: 'Jetzt überspringen'
- extendedWaitUntil:
    visible: 'Wallet Backup'
    timeout: 60000
- takeScreenshot: shots/01-onboarding/05-wallet-uebersicht
- tapOn:
    point: '16%,93%'
- extendedWaitUntil:
    visible: 'Nicht erlauben'
    timeout: 25000
- takeScreenshot: shots/01-onboarding/06-mitteilungen-berechtigung

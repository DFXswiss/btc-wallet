appId: swiss.dfx.bitcoin
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: 'Erstellen'
    timeout: 60000
- tapOn: 'Erstellen'
- extendedWaitUntil:
    visible: 'Wallet Backup'
    timeout: 60000
# Lightning-Wallet ist opt-in: "Hinzufuegen" in der Lightning-Zeile der Uebersicht.
- tapOn:
    point: '85%,58%'
- extendedWaitUntil:
    visible: 'lightning.space'
    timeout: 30000
- tapOn: 'lightning.space'
- waitForAnimationToEnd:
    timeout: 3000
- tapOn: 'Fortsetzen'
- extendedWaitUntil:
    visible: 'Wallet Backup'
    timeout: 60000
# Mitteilungs-Dialog einmal abraeumen
- tapOn:
    point: '16%,93%'
- waitForAnimationToEnd:
    timeout: 12000
- runFlow:
    when:
      visible: 'Nicht erlauben'
    commands:
      - tapOn: 'Nicht erlauben'
- waitForAnimationToEnd:
    timeout: 3000
- tapOn: 'Schließen'
- extendedWaitUntil:
    visible: 'Wallet Backup'
    timeout: 30000

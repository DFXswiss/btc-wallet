appId: swiss.dfx.bitcoin
---
- launchApp:
    clearState: true
- runFlow:
    when:
      visible: 'Nicht erlauben'
    commands:
      - tapOn: 'Nicht erlauben'
- extendedWaitUntil:
    visible: 'Erstellen'
    timeout: 60000
- tapOn: 'Erstellen'
- extendedWaitUntil:
    visible: 'Jetzt überspringen'
    timeout: 60000
- tapOn: 'Jetzt überspringen'
- extendedWaitUntil:
    visible: 'Wallet Backup'
    timeout: 60000
# Mitteilungs-Dialog einmal provozieren und abraeumen, damit er spaetere
# Navigation nicht mehr verdeckt (er erscheint beim ersten Oeffnen von "Erhalten").
- tapOn:
    point: '16%,93%'
- waitForAnimationToEnd:
    timeout: 12000
- runFlow:
    when:
      visible: 'Nicht erlauben'
    commands:
      - tapOn: 'Nicht erlauben'
- waitForAnimationToEnd:
    timeout: 3000
- tapOn: 'Schließen'
- extendedWaitUntil:
    visible: 'Wallet Backup'
    timeout: 30000

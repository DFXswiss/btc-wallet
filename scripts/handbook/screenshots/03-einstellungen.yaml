appId: swiss.dfx.bitcoin
---
- runFlow: _setup.yaml
- tapOn:
    point: '90%,10%'
- extendedWaitUntil:
    visible: 'Allgemein'
    timeout: 20000
- takeScreenshot: shots/03-einstellungen/01-menue

- tapOn: 'Allgemein'
- waitForAnimationToEnd:
    timeout: 6000
- takeScreenshot: shots/03-einstellungen/02-allgemein
- tapOn: 'Settings'
- extendedWaitUntil:
    visible: 'Feature Flags'
    timeout: 15000

# On-Chain-Wallet → Wallet-Einstellungen (committiert als 03-wallet-einstellungen).
# Lightning-Wallet / Multi-Device-Wallet: ohne Wallet deaktiviert; mit Spark/LDS
# bzw. Multisig oeffnet der Eintrag WalletDetails. Das fehlende Spark-Einstellungs-
# PNG ist eine dokumentierte redaktionelle Luecke, nicht „kein Bildschirm" —
# daher kein takeScreenshot und kein Tap in diesem Flow.
- tapOn: 'On-Chain-Wallet'
- waitForAnimationToEnd:
    timeout: 6000
- takeScreenshot: shots/03-einstellungen/03-wallet-einstellungen
- tapOn: 'Settings'
- extendedWaitUntil:
    visible: 'Feature Flags'
    timeout: 15000

- tapOn: 'Währung'

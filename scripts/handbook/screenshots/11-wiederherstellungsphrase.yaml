appId: swiss.dfx.bitcoin
---
- runFlow: _setup.yaml
# Privatsphaere-Blur abschalten (Abschnitts-Header 12x tippen, Easter Egg in
# SettingsPrivacy.js: setIsPrivacyBlurEnabled(!(tapped >= 10)))
- tapOn:
    point: '90%,10%'
- extendedWaitUntil:
    visible: 'Allgemein'
    timeout: 20000
- tapOn: 'Allgemein'
- extendedWaitUntil:
    visible: 'Privatsphäre'
    timeout: 15000
- tapOn: 'Privatsphäre'
- extendedWaitUntil:
    visible: 'Zwischenablage lesen'
    timeout: 15000
- repeat:
    times: 12
    commands:
      - tapOn:
          point: '50%,20%'
- waitForAnimationToEnd:
    timeout: 3000
- tapOn:
    point: '20%,10%'
- extendedWaitUntil:
    visible: 'Kontinuität'
    timeout: 15000
- tapOn:
    point: '20%,10%'
- extendedWaitUntil:
    visible: 'On-Chain-Wallet'
    timeout: 15000

# Von der Settings-Wurzel zurueck auf die Wallet-Uebersicht
- tapOn: 'Back'
- extendedWaitUntil:
    visible: 'Wallet Backup'
    timeout: 25000
- tapOn: 'Wallet Backup'
- extendedWaitUntil:
    visible: 'Bereit'
    timeout: 25000
# Backup-Erklaerung (vor dem Phrase-Screen).
- takeScreenshot: shots/02-wallet/02-backup-erklaerung
- tapOn: 'Bereit'
- waitForAnimationToEnd:
    timeout: 9000
# Privacy.enableBlur — Maestro oft schwarz; ggf. simctl io screenshot.
- takeScreenshot: shots/02-wallet/08-wiederherstellungsphrase

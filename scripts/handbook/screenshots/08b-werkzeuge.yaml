appId: swiss.dfx.bitcoin
---
- runFlow: _setup.yaml
- tapOn:
    point: '90%,10%'
- extendedWaitUntil:
    visible: 'Werkzeuge'
    timeout: 20000
- tapOn: 'Werkzeuge'
- extendedWaitUntil:
    visible: 'Transaktion publizieren'
    timeout: 15000
- takeScreenshot: shots/03-einstellungen/16-werkzeuge-uebersicht
- tapOn: 'Ist dies meine Adresse\?'
- waitForAnimationToEnd:
    timeout: 8000
- takeScreenshot: shots/03-einstellungen/17-ist-dies-meine-adresse
- tapOn: 'Werkzeuge'
- extendedWaitUntil:
    visible: 'Transaktion publizieren'
    timeout: 15000
- tapOn: 'Transaktion publizieren'
- waitForAnimationToEnd:
    timeout: 8000
- takeScreenshot: shots/03-einstellungen/18-transaktion-publizieren

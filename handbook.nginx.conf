server {
    listen 8080 default_server;
    server_name _;

    # Emit relative Location headers so redirects work behind a reverse
    # proxy — otherwise nginx prepends the internal listen address and
    # the browser follows a host it cannot reach.
    absolute_redirect off;

    root /usr/share/nginx/html;
    index index.html;

    # Hide nginx version in Server header.
    server_tokens off;

    # Security headers for a static, embed-safe handbook (public, no auth wall).
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # CSP: handbook is static self-hosted HTML/CSS/JS/images only.
    # style-src 'unsafe-inline': build.js inlines CSS in <style> (no separate CSS file).
    # script-src 'self' only: TOC helper is handbook.js, not inline.
    # img-src data: unused today but harmless for future inline icons.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'self'" always;
    # Kept private/no-store for now; with no auth wall public caching would be
    # possible — product decision, not changed here.
    add_header Cache-Control "private, no-store" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    # text/html is gzipped by default; do not list it again.
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        image/svg+xml;

    # Health endpoint — Dockerfile HEALTHCHECK and CI smoke.
    # nginx add_header is all-or-nothing per location, so server-level
    # security headers are restated here.
    location = /healthz {
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'self'" always;
        add_header Cache-Control "no-store" always;
        default_type text/plain;
        return 200 "OK\n";
    }

    # PDFs inline in the browser (not forced download). Restate headers
    # because add_header is all-or-nothing per location.
    location ~* \.pdf$ {
        add_header Content-Disposition "inline" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'self'" always;
        add_header Cache-Control "private, no-store" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}

appId: swiss.dfx.bitcoin
---
# Spark receive shows a spark1 address. There is no Lightning address and no invoice.
- runFlow: ../_setup.yaml
- tapOn:
    point: '85%,58%'
- waitForAnimationToEnd:
    timeout: 90000
- extendedWaitUntil:
    visible: 'Bitcoin, Lightning, 0 sats, .*'
    timeout: 90000
- tapOn:
    point: '50%,58%'
- waitForAnimationToEnd:
    timeout: 15000
- tapOn:
    point: '16%,93%'
- extendedWaitUntil:
    visible: '.*spark1.*'
    timeout: 60000
- assertVisible: '.*spark1.*'
- assertNotVisible: '.*@breez\.tips.*'
- assertNotVisible: 'Amount (optional)'
- assertNotVisible: 'On-Chain'
- assertNotVisible: '.*lnbc.*'
- assertNotVisible: '.*bc1.*'

appId: swiss.dfx.bitcoin
---
- runFlow: ../_setup.yaml
- tapOn:
    point: '85%,58%'
- waitForAnimationToEnd:
    timeout: 90000
- extendedWaitUntil:
    visible: 'Bitcoin, Lightning \(Spark\), 0 sats, .*'
    timeout: 90000
- extendedWaitUntil:
    visible: 'Externe Services'
    timeout: 90000
# Die Verkaufen-Kachel ist ein Bitmap ohne semantischen Selektor. Bei zwei
# sichtbaren DFX-Kacheln liegt ihr gemessener Mittelpunkt hier.
- tapOn:
    point: '61%,34%'
- waitForAnimationToEnd:
    timeout: 30000
# Exakter Seitentitel und KYC-Aktion belegen gemeinsam die externe
# DFX-Verkaufsoberflaeche; der bekannte Fehlerdialog darf nicht sichtbar sein.
- extendedWaitUntil:
    visible: 'KYC VERVOLLSTÄNDIGEN'
    timeout: 30000
- assertVisible: 'Verkaufen'
- assertVisible: 'KYC VERVOLLSTÄNDIGEN'
- assertNotVisible: 'Invalid signature'

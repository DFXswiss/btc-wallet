appId: swiss.dfx.bitcoin
env:
  E2E_PAYMENT_SAT: ${E2E_PAYMENT_SAT || '10'}
  E2E_SEND_SAT: ${E2E_SEND_SAT || '1'}
---
- runFlow: ../_setup.yaml
- runScript:
    file: ../scripts/payment-amount.js
    env:
      E2E_PAYMENT_SAT: ${E2E_PAYMENT_SAT || '10'}
- tapOn:
    point: '85%,58%'
- waitForAnimationToEnd:
    timeout: 90000
- extendedWaitUntil:
    visible: 'Bitcoin, Lightning \(Spark\), 0 sats, .*'
    timeout: 90000
- tapOn:
    point: '50%,58%'
- waitForAnimationToEnd:
    timeout: 15000
- tapOn:
    point: '16%,93%'
- extendedWaitUntil:
    visible: 'Amount (optional)'
    timeout: 20000
- tapOn: 'Amount (optional)'
- inputText: ${output.paymentSat}
- tapOn: 'sats'
- extendedWaitUntil:
    visible: '.*lnbc.*'
    timeout: 30000
- tapOn: 'Beschreibung (optional)'
- inputText: 'Maestro-E2E'
- tapOn: 'sats'
# Betragsunabhaengig: 10 sat ist lnbc100n, 1000 sat waere lnbc10u.
- extendedWaitUntil:
    visible: '.*lnbc.*'
    timeout: 30000
- copyTextFrom: '.*lnbc.*'
- runScript:
    file: ../scripts/treasury.js
    env:
      TREASURY_CMD: pay
      E2E_TREASURY_URL: ${E2E_TREASURY_URL || ''}
      E2E_TREASURY_KEY: ${E2E_TREASURY_KEY || ''}
      E2E_TREASURY_MAX_SAT: ${E2E_TREASURY_MAX_SAT || ''}
      E2E_TREASURY_MAX_FEE_SAT: ${E2E_TREASURY_MAX_FEE_SAT || ''}
- extendedWaitUntil:
    visible: 'Fertig'
    timeout: 120000
# runScript ersetzt output. Betragswerte unmittelbar vor der Zusicherung neu setzen.
- runScript:
    file: ../scripts/payment-amount.js
    env:
      E2E_PAYMENT_SAT: ${E2E_PAYMENT_SAT || '10'}
- assertVisible: '^${E2E_PAYMENT_SAT}$'
- assertVisible: '^ sats$'
- assertVisible: '^Maestro-E2E$'
- assertVisible: 'Fertig'
- tapOn: 'Fertig'
- waitForAnimationToEnd:
    timeout: 15000
# Die Listen-Zeile mit dem neuen Saldo erschien erst nach einem Neustart
# ohne Zustandsloeschung, nicht auf dem offen gebliebenen Schirm.
- runFlow: ../_relaunch-keep-state.yaml
- extendedWaitUntil:
    visible: ${'Bitcoin, Lightning \\(Spark\\), ' + output.walletBalanceText + ', .*'}
    timeout: 90000
- tapOn:
    point: '50%,58%'
- waitForAnimationToEnd:
    timeout: 15000
# Senden ist 1/10 des Empfangsbetrags, damit die Spark-Gebuehr in das
# nach dem Empfang vorhandene Guthaben passt (bei 10 sat also 1 sat).
- runScript:
    file: ../scripts/treasury.js
    env:
      TREASURY_CMD: invoice
      TREASURY_SAT: ${output.sendSat}
      TREASURY_MEMO: Maestro-E2E-send
      E2E_TREASURY_URL: ${E2E_TREASURY_URL || ''}
      E2E_TREASURY_KEY: ${E2E_TREASURY_KEY || ''}
      E2E_TREASURY_MAX_SAT: ${E2E_TREASURY_MAX_SAT || ''}
      E2E_TREASURY_MAX_FEE_SAT: ${E2E_TREASURY_MAX_FEE_SAT || ''}
- openLink:
    link: ${'dfxtaro:lightning:' + output.bolt11}
- runFlow:
    when:
      visible: 'Öffnen'
    commands:
      - tapOn: 'Öffnen'
- runFlow:
    when:
      visible: 'Open'
    commands:
      - tapOn: 'Open'
# invoice hat output ersetzt. sendSat neu setzen und den Invoice-Hash durchreichen.
- runScript:
    file: ../scripts/payment-amount.js
    env:
      E2E_PAYMENT_SAT: ${E2E_PAYMENT_SAT || '10'}
      TREASURY_HASH: ${output.paymentHash || ''}
- extendedWaitUntil:
    visible: 'Weiter'
    timeout: 30000
- assertVisible: '^${E2E_SEND_SAT}$'
- assertVisible: 'Senden'
- tapOn: 'Weiter'
- extendedWaitUntil:
    visible: 'Zahlen'
    timeout: 60000
- waitForAnimationToEnd:
    timeout: 8000
- tapOn: 'Zahlen'
- extendedWaitUntil:
    visible: 'Fertig'
    timeout: 120000
- assertVisible: '^${E2E_SEND_SAT}$'
- assertVisible: '^ sats$'
- assertVisible: '^Maestro-E2E-send$'
- assertVisible: 'Fertig'
- runScript:
    file: ../scripts/treasury.js
    env:
      TREASURY_CMD: status
      TREASURY_HASH: ${output.paymentHash || ''}
      E2E_TREASURY_URL: ${E2E_TREASURY_URL || ''}
      E2E_TREASURY_KEY: ${E2E_TREASURY_KEY || ''}
      E2E_TREASURY_MAX_SAT: ${E2E_TREASURY_MAX_SAT || ''}
      E2E_TREASURY_MAX_FEE_SAT: ${E2E_TREASURY_MAX_FEE_SAT || ''}
- assertTrue: ${output.treasuryPaid === 'true'}
- runScript:
    file: ../scripts/payment-amount.js
    env:
      E2E_PAYMENT_SAT: ${E2E_PAYMENT_SAT || '10'}
- tapOn: 'Fertig'
- waitForAnimationToEnd:
    timeout: 15000
- runFlow: ../_relaunch-keep-state.yaml
- extendedWaitUntil:
    visible: 'Bitcoin, Lightning \(Spark\), .*sats, .*'
    timeout: 90000
- assertNotVisible: ${'Bitcoin, Lightning \\(Spark\\), ' + output.walletBalanceText + ', .*'}
- assertNotVisible: 'Bitcoin, Lightning \(Spark\), 0 sats, .*'

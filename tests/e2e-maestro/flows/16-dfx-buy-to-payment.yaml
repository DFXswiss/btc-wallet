      text: 'Lightning \(Spark\)'
    timeout: 60000
- extendedWaitUntil:
    visible:
      id: WalletBalance
      text: '.*sats'
    timeout: 60000
- copyTextFrom:
    id: WalletBalance
    text: '[0-9][0-9., ]+sats'
- evalScript: "${output.walletBalanceText = String(maestro.copiedText || '').trim()}"
# runScript ersetzt output. Werte, die einen spaeteren runScript
# ueberdauern muessen, gehen als env-Bindung in den folgenden Lauf.
- runFlow:
    env:
      WALLET_BALANCE_TEXT: ${output.walletBalanceText}
    commands:
      - runScript:
          file: ../scripts/backend-state.js
          env:
            E2E_API_URL: ${E2E_API_URL || ''}
            E2E_DFX_JWT: ${E2E_DFX_JWT || ''}
            STATE_KIND: snapshot
      - assertTrue:
          condition: ${output.backendMaxTxId != null && output.backendMaxTxId != '' && output.backendMaxTxId != 'undefined'}
          label: backendMaxTxId missing after snapshot
      - runFlow:
          env:
            MIN_TX_ID: "${Number(output.backendMaxTxId) > 0 ? String(output.backendMaxTxId) : ''}"
            WALLET_BALANCE_TEXT: ${WALLET_BALANCE_TEXT}
          commands:
            - evalScript: "${output.simIdempotencyKey = 'p16-' + Date.now()}"
            - runScript:
                file: ../scripts/dfx-simulate-payment.js
                env:
                  E2E_API_URL: ${E2E_API_URL || ''}
                  E2E_DFX_JWT: ${E2E_DFX_JWT || ''}
                  SIM_AMOUNT: ${E2E_BUY_CHF || '0.20'}
                  SIM_IDEMPOTENCY_KEY: ${output.simIdempotencyKey}
            - assertTrue:
                condition: ${output.simulatedPayment === 'ok'}
                label: simulatedPayment is not ok
            - evalScript: "${output.walletBalanceText = String(WALLET_BALANCE_TEXT || '').trim(); output.walletBalanceRegex = '^' + String(output.walletBalanceText).replace(/[.]/g, '[.,]') + '$'; output.walletBalanceBeforeSat = String(Number(String((String(output.walletBalanceText || '').match(/([0-9][0-9., ]*)sats/i) || [])[1] || 'NaN').replace(/[^0-9]/g, '') || 'NaN'))}"
            - assertTrue:
                condition: ${output.walletBalanceRegex != null && output.walletBalanceRegex != '' && output.walletBalanceRegex != 'undefined'}
                label: walletBalanceRegex missing after simulated payment

appId: swiss.dfx.bitcoin
env:
  E2E_PAYMENT_SAT: ${E2E_PAYMENT_SAT || '10'}
  E2E_SPARK_MNEMONIC: ${E2E_SPARK_MNEMONIC || ''}
  E2E_SPARK_WALLET_ADDRESS: ${E2E_SPARK_WALLET_ADDRESS || ''}
  E2E_API_URL: ${E2E_API_URL || ''}
  E2E_DFX_JWT: ${E2E_DFX_JWT || ''}
  E2E_BUY_CHF: ${E2E_BUY_CHF || '0.20'}
---
# P16 prueft die Kaufmaske der Wallet ueber Spark: die Maske nennt die
# gekuerzte eigene Wallet-Adresse und Spark, die Zahlungsinformation zeigt
# IBAN und BIC, Invalid signature bleibt aus.
#
# Danach loest der Flow ueber die API eine eingehende Zahlung auf der
# Kaufroute aus, wartet bis das Backend diesen Kauf als Completed verbucht
# (id groesser als der Snapshot vor dem Ausloesen), und prueft, dass der
# Spark-Saldo in der Wallet gestiegen ist. Belegt ist die durchgaengige
# Verbuchung: Fiat-Eingang auf der Kaufroute, abgeschlossener Kauf,
# Spark-Gutschrift in der Wallet.
# Die Vorgabe E2E_BUY_CHF=0,20 ergibt bei den Kursen dieses Aufbaus rund
# 260 Satoshi und ist damit aus dem vorhandenen Bestand zahlbar.
# Die Saldo-Zusicherung prueft nur, dass der Betrag gestiegen ist, nicht
# einen festen Zuwachs: der Auszahlungsbetrag folgt dem Kurs und ist nicht
# vorhersagbar.
- runFlow:
    when:
      true: ${E2E_SPARK_WALLET_ADDRESS === ''}
    commands:
      - assertTrue:
          condition: ${false}
          label: E2E_SPARK_WALLET_ADDRESS is missing. Set the identity's own Spark address (user.address on the local stack) outside the repository and pass it to maestro test as -e E2E_SPARK_WALLET_ADDRESS. See tests/e2e-maestro/README.md. Do not use E2E_SPARK_DEPOSIT_ADDRESS; that is DFX's sell deposit, not the wallet's receive address.
- runFlow:
    file: ../_setup-import.yaml
    env:
      E2E_SPARK_MNEMONIC: ${E2E_SPARK_MNEMONIC || ''}
- runScript:
    file: ../scripts/payment-amount.js
    env:
      E2E_PAYMENT_SAT: ${E2E_PAYMENT_SAT || '10'}
- extendedWaitUntil:
    visible: 'Bitcoin, Lightning \(Spark\), .*sats, .*'
    timeout: 90000
- extendedWaitUntil:
    visible: 'Externe Services'
    timeout: 90000
# Die Kaufen-Kachel ist ein Bitmap in ImageButton ohne testID oder
# accessibilityLabel. Der Punkt wurde am gerenderten Handbuchbild gemessen.
- tapOn:
    point: '38%,34%'
- waitForAnimationToEnd:
    timeout: 30000
- runFlow:
    when:
      visible: 'NUTZERDATEN EINGEBEN'
    commands:
      - assertTrue:
          condition: ${false}
          label: P16 needs a tradable local-stack account. Run tests/e2e-maestro/scripts/seed-local-backend.sql against the local stack only (see tests/e2e-maestro/README.md).
- extendedWaitUntil:
    visible: '^Kaufen$'
    timeout: 30000
- assertVisible: '^DFX\.swiss \| Buy & Sell directly into your wallet$'
- assertVisible: '^Kaufen$'
- assertNotVisible: '^Login bei DFX Services$'
- assertNotVisible: 'Invalid signature'
- waitForAnimationToEnd:
    timeout: 8000
# Das Neuladen-Icon des In-App-Browsers hat keinen semantischen Selektor. Der
# Punkt wurde im Simulator am gerenderten Browser gemessen. Ohne diesen Reload
# behaelt die Seite den verfruehten KYC-Zustand.
- tapOn:
    point: '72%,93%'
# Adresse und Netz stehen in einem Element, zeilenumbruchgetrennt. Das Muster
# kommt von E2E_SPARK_WALLET_ADDRESS (erste und letzte zwoelf Zeichen), wie
# P17 die Einzahlungsadresse kuerzt; (?s) laesst den Punkt den Umbruch
# ueberqueren. Erst danach zur Zahlungsinformation.
- extendedWaitUntil:
    visible: ${'(?s)' + E2E_SPARK_WALLET_ADDRESS.slice(0, 12) + '.*' + E2E_SPARK_WALLET_ADDRESS.slice(-12) + '.*Spark'}
    timeout: 30000
- assertVisible: ${'(?s)' + E2E_SPARK_WALLET_ADDRESS.slice(0, 12) + '.*' + E2E_SPARK_WALLET_ADDRESS.slice(-12) + '.*Spark'}
- scrollUntilVisible:
    element: 'IBAN'
    direction: DOWN
    timeout: 20000
- assertVisible: '^Zahlungsinformation$'
- assertVisible: 'IBAN'
- assertVisible: 'BIC'
- assertNotVisible: 'Invalid signature'
- assertNotVisible: '^KYC VERVOLLSTÄNDIGEN$'
- assertNotVisible: 'NUTZERDATEN EINGEBEN'
- runFlow:
    when:
      visible: 'Schließen'
    commands:
      - tapOn: 'Schließen'
- runFlow:
    when:
      visible: 'Zurück zu BTC Taro'
    commands:
      - tapOn: 'Zurück zu BTC Taro'
- runFlow:
    when:
      visible: 'Fertig'
    commands:
      - tapOn: 'Fertig'
- waitForAnimationToEnd:
    timeout: 15000
- runFlow:
    when:
      notVisible: 'Bitcoin, Lightning \(Spark\), .*sats, .*'
    commands:
      - runFlow: ../_relaunch-keep-state.yaml
- extendedWaitUntil:
    visible: 'Bitcoin, Lightning \(Spark\), .*sats, .*'
    timeout: 90000
- tapOn:
    point: '50%,58%'
- waitForAnimationToEnd:
    timeout: 15000
- extendedWaitUntil:
    visible:
      id: WalletLabel
      text: 'Lightning \(Spark\)'
    timeout: 60000
- extendedWaitUntil:
    visible:
      id: WalletBalance
      text: '.*sats'
    timeout: 60000
- copyTextFrom:
    id: WalletBalance
    text: '[0-9][0-9., ]+sats'
- evalScript: "${output.walletBalanceText = String(maestro.copiedText || '').trim()}"
# runScript setzt output zurueck. Saldo und Snapshot-Wert werden deshalb
# ausserhalb von output gehalten und vor dem jeweils naechsten runScript
# als env wieder hineingegeben.
- evalScript: "${savedWalletBalanceText = String(output.walletBalanceText || '').trim(); savedWalletBalanceSat = (function(){ var m = savedWalletBalanceText.match(/([0-9][0-9., ]*)sats/i); var sat = m ? Number(String(m[1]).replace(/[^0-9]/g, '')) : NaN; return sat; })(); savedWalletBalanceRegex = '^' + savedWalletBalanceText.replace(/[.]/g, '[.,]') + '$'; output.walletBalanceRegex = savedWalletBalanceRegex}"
- runScript:
    file: ../scripts/backend-state.js
    env:
      E2E_API_URL: ${E2E_API_URL || ''}
      E2E_DFX_JWT: ${E2E_DFX_JWT || ''}
      STATE_KIND: snapshot
- evalScript: "${savedMaxTxId = String(output.backendMaxTxId || '')}"
- assertTrue:
    condition: ${savedMaxTxId != null && savedMaxTxId != '' && savedMaxTxId != 'undefined'}
    label: backendMaxTxId missing after snapshot
- runScript:
    file: ../scripts/dfx-simulate-payment.js
    env:
      E2E_API_URL: ${E2E_API_URL || ''}
      E2E_DFX_JWT: ${E2E_DFX_JWT || ''}
      SIM_AMOUNT: ${E2E_BUY_CHF || '0.20'}
- assertTrue:
    condition: ${output.simulatedPayment === 'ok'}
    label: simulatedPayment is not ok
# Nach dem Ausloesen steht die Transaktion nicht sofort in der Liste.
- evalScript: "${output.backendMaxTxId = savedMaxTxId}"
- runScript:
    file: ../scripts/backend-state.js
    env:
      E2E_API_URL: ${E2E_API_URL || ''}
      E2E_DFX_JWT: ${E2E_DFX_JWT || ''}
      STATE_KIND: buy-complete
      MIN_TX_ID: ${Number(savedMaxTxId) > 0 ? String(savedMaxTxId) : ''}
      TIMEOUT_MS: '900000'
- assertTrue:
    condition: ${output.backendState === 'ok'}
    label: backendState is not ok after buy-complete
- evalScript: "${output.walletBalanceRegex = savedWalletBalanceRegex; output.walletBalanceText = savedWalletBalanceText; output.walletBalanceBeforeSat = String(savedWalletBalanceSat)}"
- assertTrue:
    condition: ${output.walletBalanceRegex != null && output.walletBalanceRegex != '' && output.walletBalanceRegex != 'undefined'}
    label: walletBalanceRegex missing after buy-complete
- runFlow: ../_relaunch-keep-state.yaml
- extendedWaitUntil:
    visible: 'Bitcoin, Lightning \(Spark\), .*sats, .*'
    timeout: 90000
- tapOn:
    point: '50%,58%'
- waitForAnimationToEnd:
    timeout: 15000
- extendedWaitUntil:
    visible:
      id: WalletLabel
      text: 'Lightning \(Spark\)'
    timeout: 60000
- extendedWaitUntil:
    visible:
      id: WalletBalance
      text: '.*sats'
    timeout: 60000
- extendedWaitUntil:
    notVisible:
      id: WalletBalance
      text: ${output.walletBalanceRegex}
    timeout: 120000
- copyTextFrom:
    id: WalletBalance
    text: '[0-9][0-9., ]+sats'
- evalScript: "${output.walletBalanceAfterText = String(maestro.copiedText || '').trim(); output.walletBalanceAfterSat = (function(){ var m = String(output.walletBalanceAfterText || '').match(/([0-9][0-9., ]*)sats/i); var sat = m ? Number(String(m[1]).replace(/[^0-9]/g, '')) : NaN; return sat; })(); output.expectedBalanceRegex = '^' + String(output.walletBalanceAfterText).replace(/[.]/g, '[.,]') + '$'}"
- assertTrue:
    condition: ${Number.isFinite(Number(output.walletBalanceBeforeSat)) && Number.isFinite(Number(output.walletBalanceAfterSat)) && Number(output.walletBalanceAfterSat) > Number(output.walletBalanceBeforeSat)}
    label: Spark balance did not increase after buy-complete
- assertTrue:
    condition: ${output.expectedBalanceRegex != null && output.expectedBalanceRegex != '' && output.expectedBalanceRegex != 'undefined'}
    label: expectedBalanceRegex missing after buy-complete
- assertVisible:
    id: WalletLabel
    text: 'Lightning \(Spark\)'
- assertVisible:
    id: WalletBalance
    text: ${output.expectedBalanceRegex}
- assertNotVisible:
    id: WalletBalance
    text: ${output.walletBalanceRegex}

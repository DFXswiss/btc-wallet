appId: swiss.dfx.bitcoin
env:
  E2E_PAYMENT_SAT: ${E2E_PAYMENT_SAT || '10'}
  E2E_SPARK_MNEMONIC: ${E2E_SPARK_MNEMONIC || ''}
  E2E_SPARK_WALLET_ADDRESS: ${E2E_SPARK_WALLET_ADDRESS || ''}
  E2E_API_URL: ${E2E_API_URL || ''}
  E2E_DFX_JWT: ${E2E_DFX_JWT || ''}
  E2E_BUY_CHF: ${E2E_BUY_CHF || '0.20'}
---
# P16 prueft die Kaufmaske der Wallet ueber Spark: die Maske nennt die
# gekuerzte eigene Wallet-Adresse und Spark, die Zahlungsinformation zeigt
# IBAN und BIC, Invalid signature bleibt aus.
#
# Danach loest der Flow ueber die API eine eingehende Zahlung auf der
# Kaufroute aus, wartet in zwoelf gleichen Bloecken aus Neustart plus
# kurzer Backend-Abfrage, bis das Backend diesen Kauf als Completed
# verbucht (id groesser als der Snapshot vor dem Ausloesen), und sichert
# danach den gestiegenen Spark-Saldo zu. Belegt ist die durchgaengige
# Verbuchung: Fiat-Eingang auf der Kaufroute, abgeschlossener Kauf,
# Spark-Gutschrift in der Wallet.
# Die Vorgabe E2E_BUY_CHF=0,20 ergibt bei den Kursen dieses Aufbaus rund
# 260 Satoshi und ist damit aus dem vorhandenen Bestand zahlbar.
# Die Saldo-Zusicherung prueft nur, dass der Betrag gestiegen ist, nicht
# einen festen Zuwachs: der Auszahlungsbetrag folgt dem Kurs und ist nicht
# vorhersagbar.
- runFlow:
    when:
      true: ${E2E_SPARK_WALLET_ADDRESS === ''}
    commands:
      - assertTrue:
          condition: ${false}
          label: E2E_SPARK_WALLET_ADDRESS is missing. Set the identity's own Spark address (user.address on the local stack) outside the repository and pass it to maestro test as -e E2E_SPARK_WALLET_ADDRESS. See tests/e2e-maestro/README.md. Do not use E2E_SPARK_DEPOSIT_ADDRESS; that is DFX's sell deposit, not the wallet's receive address.
- runFlow:
    file: ../_setup-import.yaml
    env:
      E2E_SPARK_MNEMONIC: ${E2E_SPARK_MNEMONIC || ''}
- runScript:
    file: ../scripts/payment-amount.js
    env:
      E2E_PAYMENT_SAT: ${E2E_PAYMENT_SAT || '10'}
- extendedWaitUntil:
    visible: 'Bitcoin, Lightning \(Spark\), .*sats, .*'
    timeout: 90000
- extendedWaitUntil:
    visible: 'Externe Services'
    timeout: 90000
# Die Kaufen-Kachel ist ein Bitmap in ImageButton ohne testID oder
# accessibilityLabel. Der Punkt wurde am gerenderten Handbuchbild gemessen.
- tapOn:
    point: '38%,34%'
- waitForAnimationToEnd:
    timeout: 30000
- runFlow:
    when:
      visible: 'NUTZERDATEN EINGEBEN'
    commands:
      - assertTrue:
          condition: ${false}
          label: P16 needs a tradable local-stack account. Run tests/e2e-maestro/scripts/seed-local-backend.sql against the local stack only (see tests/e2e-maestro/README.md).
- extendedWaitUntil:
    visible: '^Kaufen$'
    timeout: 30000
- assertVisible: '^DFX\.swiss \| Buy & Sell directly into your wallet$'
- assertVisible: '^Kaufen$'
- assertNotVisible: '^Login bei DFX Services$'
- assertNotVisible: 'Invalid signature'
- waitForAnimationToEnd:
    timeout: 8000
# Das Neuladen-Icon des In-App-Browsers hat keinen semantischen Selektor. Der
# Punkt wurde im Simulator am gerenderten Browser gemessen. Ohne diesen Reload
# behaelt die Seite den verfruehten KYC-Zustand.
- tapOn:
    point: '72%,93%'
# Adresse und Netz stehen in einem Element, zeilenumbruchgetrennt. Das Muster
# kommt von E2E_SPARK_WALLET_ADDRESS (erste und letzte zwoelf Zeichen), wie
# P17 die Einzahlungsadresse kuerzt; (?s) laesst den Punkt den Umbruch
# ueberqueren. Erst danach zur Zahlungsinformation.
- extendedWaitUntil:
    visible: ${'(?s)' + E2E_SPARK_WALLET_ADDRESS.slice(0, 12) + '.*' + E2E_SPARK_WALLET_ADDRESS.slice(-12) + '.*Spark'}
    timeout: 30000
- assertVisible: ${'(?s)' + E2E_SPARK_WALLET_ADDRESS.slice(0, 12) + '.*' + E2E_SPARK_WALLET_ADDRESS.slice(-12) + '.*Spark'}
- scrollUntilVisible:
    element: 'IBAN'
    direction: DOWN
    timeout: 20000
- assertVisible: '^Zahlungsinformation$'
- assertVisible: 'IBAN'
- assertVisible: 'BIC'
- assertNotVisible: 'Invalid signature'
- assertNotVisible: '^KYC VERVOLLSTÄNDIGEN$'
- assertNotVisible: 'NUTZERDATEN EINGEBEN'
- runFlow:
    when:
      visible: 'Schließen'
    commands:
      - tapOn: 'Schließen'
- runFlow:
    when:
      visible: 'Zurück zu BTC Taro'
    commands:
      - tapOn: 'Zurück zu BTC Taro'
- runFlow:
    when:
      visible: 'Fertig'
    commands:
      - tapOn: 'Fertig'
- waitForAnimationToEnd:
    timeout: 15000
- runFlow:
    when:
      notVisible: 'Bitcoin, Lightning \(Spark\), .*sats, .*'
    commands:
      - runFlow: ../_relaunch-keep-state.yaml
- extendedWaitUntil:
    visible: 'Bitcoin, Lightning \(Spark\), .*sats, .*'
    timeout: 90000
- tapOn:
    point: '50%,58%'
- waitForAnimationToEnd:
    timeout: 15000
- extendedWaitUntil:
    visible:

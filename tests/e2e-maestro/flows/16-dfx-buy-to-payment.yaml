                  E2E_DFX_JWT: ${E2E_DFX_JWT || ''}
                  SIM_AMOUNT: ${E2E_BUY_CHF || '0.20'}
                  SIM_IDEMPOTENCY_KEY: ${output.simIdempotencyKey}
            - assertTrue:
                condition: ${output.simulatedPayment === 'ok'}
                label: simulatedPayment is not ok
            # Zwoelf gleiche Bloecke, keine Schleife: repeat/while endete
            # im Lauf vom 17.09.2026 nach zwei Durchgaengen, obwohl die
            # Bedingung noch galt. MIN_TX_ID bleibt die env-Bindung dieses

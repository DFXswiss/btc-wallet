appId: swiss.dfx.bitcoin
env:
  E2E_SPARK_MNEMONIC: ${E2E_SPARK_MNEMONIC || ''}
---
# P16 prueft die Kaufmaske der Wallet ueber Spark: die Maske rendert, die
# gekuerzte spark1-Form der eigenen Wallet-Adresse und Spark sind sichtbar,
# die Zahlungsinformation zeigt IBAN und BIC, Invalid signature bleibt aus.
# Die eigene Adresse wird am Muster geprueft, nicht an einem festen Wert.
#
# Dieser Flow belegt keinen Kaufabschluss. Dafuer brauchte es eine Fiat-
# Gutschrift im Backend; das ist keine Wallet-Operation. Es gibt hier keinen
# Zahlungsschritt und keinen Saldo-Beweis.
- runFlow:
    file: ../_setup-import.yaml
    env:
      E2E_SPARK_MNEMONIC: ${E2E_SPARK_MNEMONIC || ''}
- extendedWaitUntil:
    visible: 'Bitcoin, Lightning \(Spark\), .*sats, .*'
    timeout: 90000
- extendedWaitUntil:
    visible: 'Externe Services'
    timeout: 90000
# Die Kaufen-Kachel ist ein Bitmap in ImageButton ohne testID oder
# accessibilityLabel. Der Punkt wurde am gerenderten Handbuchbild gemessen.
- tapOn:
    point: '38%,34%'
- waitForAnimationToEnd:
    timeout: 30000
- runFlow:
    when:
      visible: 'NUTZERDATEN EINGEBEN'
    commands:
      - assertTrue:
          condition: ${false}
          label: P16 needs a tradable local-stack account. Run tests/e2e-maestro/scripts/seed-local-backend.sql against the local stack only (see tests/e2e-maestro/README.md).
- extendedWaitUntil:
    visible: '^Kaufen$'
    timeout: 30000
- assertVisible: '^DFX\.swiss \| Buy & Sell directly into your wallet$'
- assertVisible: '^Kaufen$'
- assertNotVisible: '^Login bei DFX Services$'
- assertNotVisible: 'Invalid signature'
- waitForAnimationToEnd:
    timeout: 8000
# Das Neuladen-Icon des In-App-Browsers hat keinen semantischen Selektor. Der
# Punkt wurde im Simulator am gerenderten Browser gemessen. Ohne diesen Reload
# behaelt die Seite den verfruehten KYC-Zustand.
- tapOn:
    point: '72%,93%'
# Adresse und Netz stehen in einem Element, zeilenumbruchgetrennt.
# assertVisible verankert am ganzen Text; (?s) laesst den Punkt den
# Zeilenumbruch ueberqueren. Erst danach zur Zahlungsinformation.
- extendedWaitUntil:
    visible: '(?s)spark1.*Spark'
    timeout: 30000
- assertVisible: '(?s)spark1.*Spark'
- scrollUntilVisible:
    element: 'IBAN'
    direction: DOWN
    timeout: 20000
- assertVisible: '^Zahlungsinformation$'
- assertVisible: 'IBAN'
- assertVisible: 'BIC'
- assertNotVisible: 'Invalid signature'
- assertNotVisible: '^KYC VERVOLLSTÄNDIGEN$'
- assertNotVisible: 'NUTZERDATEN EINGEBEN'

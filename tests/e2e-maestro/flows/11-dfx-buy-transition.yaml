appId: swiss.dfx.bitcoin
---
- runFlow: ../_setup.yaml
- tapOn:
    point: '85%,58%'
- waitForAnimationToEnd:
    timeout: 90000
- extendedWaitUntil:
    visible: 'Bitcoin, Lightning \(Spark\), 0 sats, .*'
    timeout: 90000
- extendedWaitUntil:
    visible: 'Externe Services'
    timeout: 90000
# Die Kaufen-Kachel ist ein Bitmap in ImageButton ohne testID oder
# accessibilityLabel. Der Punkt wurde am gerenderten Handbuchbild gemessen.
- tapOn:
    point: '38%,34%'
- waitForAnimationToEnd:
    timeout: 30000
# App-spezifischer Ruecksprung und exakter Seitentitel belegen gemeinsam den
# Wechsel zu DFX. Login, Kaufformular und Abschluss sind nicht Ziel des Flows.
- extendedWaitUntil:
    visible: '^Zurück zu BTC Taro$'
    timeout: 30000
- assertVisible: '^Zurück zu BTC Taro$'
- assertVisible: '^DFX\.swiss \| Buy & Sell directly into your wallet$'
- assertNotVisible: 'Invalid signature'

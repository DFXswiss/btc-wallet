appId: swiss.dfx.bitcoin
---
- runFlow: ../_setup.yaml
- tapOn:
    point: '85%,58%'
- waitForAnimationToEnd:
    timeout: 90000
- extendedWaitUntil:
    visible: 'Bitcoin, Lightning \(Spark\), 0 sats, .*'
    timeout: 90000
- extendedWaitUntil:
    visible: 'Externe Services'
    timeout: 90000
# Die Kaufen-Kachel ist ein Bitmap in ImageButton ohne testID oder
# accessibilityLabel. Der Punkt wurde am gerenderten Handbuchbild gemessen.
- tapOn:
    point: '38%,34%'
- waitForAnimationToEnd:
    timeout: 30000
# Exakter Seitentitel und KYC-Aktion belegen gemeinsam die externe
# DFX-Kaufoberflaeche; der bekannte Fehlerdialog darf nicht sichtbar sein.
- extendedWaitUntil:
    visible: 'KYC VERVOLLSTÄNDIGEN'
    timeout: 30000
- assertVisible: 'Kaufen'
- assertVisible: 'KYC VERVOLLSTÄNDIGEN'
- assertNotVisible: 'Invalid signature'

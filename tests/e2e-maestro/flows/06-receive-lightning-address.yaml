appId: swiss.dfx.bitcoin
---
- runFlow: ../_setup.yaml
- tapOn:
    point: '85%,58%'
- waitForAnimationToEnd:
    timeout: 90000
- extendedWaitUntil:
    visible: 'Bitcoin, Lightning \(Spark\), 0 sats, .*'
    timeout: 90000
- tapOn:
    point: '50%,58%'
- waitForAnimationToEnd:
    timeout: 15000
- tapOn:
    point: '16%,93%'
- extendedWaitUntil:
    visible: '.*@.*'
    timeout: 30000
# Ohne Betrag ist die sichtbare Adresse zugleich die Quelle des QR-Werts.
- assertVisible: '.*@.*'
- assertNotVisible: '.*lnbc.*'
- assertNotVisible: 'Eine Empfangsadresse ist noch nicht vorhanden.*'

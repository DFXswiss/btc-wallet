appId: swiss.dfx.bitcoin
---
- runFlow: ../_setup.yaml
- tapOn:
    point: '85%,58%'
- waitForAnimationToEnd:
    timeout: 90000
- extendedWaitUntil:
    visible: 'Bitcoin, Lightning \(Spark\), 0 sats, .*'
    timeout: 90000
- tapOn:
    point: '50%,58%'
- waitForAnimationToEnd:
    timeout: 15000
# Statischer LNURL-Auth-Vektor aus tests/unit/lnurl.test.js. Der Prompt wird
# lokal aus dem LNURL dekodiert; das registrierte dfxtaro-Schema fuehrt ihn
# wie einen gescannten QR-Payload dem zentralen Deeplink-Router zu.
- openLink:
    link: 'dfxtaro:lightning:LNURL1DP68GURN8GHJ7MRFVA58GMNFDENKCMM8D9HZUMRFWEJJ7MR0VA5KU0MTXY7NYVFEX93X2DFK8P3KVEFKVSEXZWR98PSNJVRRV5CRGCE3X4JKGE3HXPNXGCMPV5MXXVTZ89NXZENXXCURGCTRV93RVE35XQCXVCFSVSN8GCT884KX7EMFDCDKKXQ0'
- runFlow:
    when:
      visible: 'Öffnen'
    commands:
      - tapOn: 'Öffnen'
- runFlow:
    when:
      visible: 'Open'
    commands:
      - tapOn: 'Open'
- extendedWaitUntil:
    visible: 'lightninglogin.live'
    timeout: 20000
- assertVisible: 'Bei'
- assertVisible: 'lightninglogin.live'
- assertVisible: 'mit dem Lightning Wallet authentifizieren?'
- assertVisible: 'Authentifizieren'
- tapOn: 'Authentifizieren'
- extendedWaitUntil:
    visible: 'Dieses Wallet kann sich mit diesem Code nicht anmelden.'
    timeout: 10000
- assertVisible: 'Authentifizierung bei lightninglogin.live fehlgeschlagen.'
- assertVisible: 'Dieses Wallet kann sich mit diesem Code nicht anmelden.'

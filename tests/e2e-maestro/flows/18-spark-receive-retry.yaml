appId: swiss.dfx.bitcoin
---
# Fresh, unfunded Spark wallet. If the initial address lookup fails, capture
# the safe retry state and exercise the explicit retry control.
- runFlow: ../_setup.yaml
- tapOn:
    point: '85%,58%'
- waitForAnimationToEnd:
    timeout: 90000
- extendedWaitUntil:
    visible: 'Bitcoin, Lightning, 0 sats, .*'
    timeout: 90000
- assertVisible: 'Bitcoin, Lightning, 0 sats, .*'
- takeScreenshot: .maestro-e2e-shots/18-spark/01-lightning-spark-wallet
- tapOn:
    point: '50%,58%'
- waitForAnimationToEnd:
    timeout: 15000
- tapOn:
    point: '16%,93%'
- runFlow:
    when:
      visible: 'Es ist noch keine Empfangsadresse verfügbar.*'
    commands:
      - assertVisible: 'Nochmal versuchen'
      - takeScreenshot: .maestro-e2e-shots/18-spark/02-receive-retry
      - tapOn: 'Nochmal versuchen'
- extendedWaitUntil:
    visible: '.*spark1.*'
    timeout: 90000
- assertVisible: '.*spark1.*'
- assertNotVisible: 'Es ist noch keine Empfangsadresse verfügbar.*'
- takeScreenshot: .maestro-e2e-shots/18-spark/03-receive-address-ready

appId: swiss.dfx.bitcoin
---
# P23 copies only the public Spark receive address into the simulator
# pasteboard so the isolated receiver can be refunded outside this flow.
# It never displays, logs, or screenshots any recovery phrase or key.
- assertVisible: 'Bitcoin, Lightning \(Spark\), 66 sats, .*'
- tapOn:
    point: '50%,58%'
- waitForAnimationToEnd:
    timeout: 12000
- extendedWaitUntil:
    visible:
      id: ReceiveButton
    timeout: 30000
- tapOn:
    id: ReceiveButton
- extendedWaitUntil:
    visible:
      id: AddressValue
      text: '.*spark1.*'
    timeout: 90000
- assertVisible:
    id: AddressValue
    text: '.*spark1.*'
- tapOn:
    id: BlueCopyTextToClipboard
- assertVisible:
    id: AddressValue
    text: '^In die Zwischenablage kopiert\.$'

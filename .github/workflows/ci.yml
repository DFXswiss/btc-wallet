name: Tests

# Fast, deterministic PR gate: lint (tsc + unused-loc + eslint) and unit tests.
# NOT gated here (intentionally):
#   - integration tests: hit live Electrum servers (flaky) — the reason this
#     workflow was disabled in 2023.
#   - e2e (Detox + Android emulator): heavy/flaky, separate concern.
on: [pull_request]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint (tsc + unused-loc + eslint)
        run: npm run lint

  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Unit tests
        run: npm run unit

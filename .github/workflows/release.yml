name: Release

# Single tag-driven store-release pipeline (mirrors RealUnitCH/app's release.yaml).
# Triggers on every vX.Y.Z tag and routes by PATCH:
#   PATCH == 0 (vX.Y.0) -> production-candidate (GitHub release, prerelease: false)
#   PATCH >= 1 (vX.Y.Z) -> internal release (auto-tag output, prerelease: true)
# Both lanes ship to the test tracks (TestFlight + Play beta); production
# promotion stays a manual console action.
#
# Phase 1 wires the guard + version derivation + the concurrency mutex.
# The ios-deploy and android-deploy jobs are added in phases 2 and 3.

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: store-release
  cancel-in-progress: false # serialise store uploads; never cancel one mid-flight

jobs:
  guard:
    name: Validate tag + derive version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      proceed: ${{ steps.check.outputs.proceed }}
      is_prerelease: ${{ steps.check.outputs.is_prerelease }}
      release_tag: ${{ steps.ver.outputs.release_tag }}
      marketing_version: ${{ steps.ver.outputs.marketing_version }}
      version_code: ${{ steps.ver.outputs.version_code }}
    steps:
      - uses: actions/checkout@v4

      - name: Inspect tag + route lane
        id: check
        run: |
          set -euo pipefail
          TAG="${{ github.ref_name }}"
          if ! echo "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::notice::$TAG is not a plain vX.Y.Z tag; skipping release."
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "proceed=true" >> "$GITHUB_OUTPUT"
          PATCH=$(echo "$TAG" | cut -d. -f3)
          if [ "$PATCH" -eq 0 ]; then
            echo "::notice::$TAG (PATCH=0) -> production-candidate release."
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::$TAG (PATCH=$PATCH) -> internal release."
            echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Derive version (hard-fail on dev sentinel)
        id: ver
        if: steps.check.outputs.proceed == 'true'
        run: |
          set -euo pipefail
          OUT=$(bash scripts/release-version.sh "${{ github.ref_name }}")
          echo "$OUT"
          echo "$OUT" >> "$GITHUB_OUTPUT"
          VC=$(echo "$OUT" | grep '^version_code=' | cut -d= -f2)
          if [ "$VC" = "0" ]; then
            echo "::error::dev sentinel (version_code=0) must never reach a store release."
            exit 1
          fi

  # --- Added in later phases ---
  # ios-deploy:     (phase 2) match + gym + upload_to_testflight + deliver
  # android-deploy: (phase 3) attested AAB + supply (Play beta) + listing

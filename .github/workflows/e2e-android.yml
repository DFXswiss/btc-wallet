name: Tests e2e Android

# Detox on an Android emulator against a release build. Not a required check yet.
# Suites whose inputs are missing fail instead of skipping. Nothing is broadcast.
#
# detox: suites without funds (on-chain, wallet details and addresses, transaction history, scan,
#   deep links, entropy, import discovery, multisig create, sign and import, settings, encrypted
#   storage, Spark receive and export). Secret BREEZ_API_KEY. Failure videos, screenshots and logs
#   are uploaded.
# detox-funded: suites that import funded recovery phrases, built against production (.env.prd,
#   secret BREEZ_API_KEY_PRD); on every run spark-receive.spec.js moves
#   21 sats plus fee from the payer wallet to the Spark test wallet, spark-transfer.spec.js moves 4 x 10
#   sats plus fees back, and spark-pay.spec.js pays 10 sats plus fee to E2E_LIGHTNING_ADDRESS. Runs in the protected environment e2e-funded, whose required
#   reviewers release HD_MNEMONIC_BIP84, SPARK_E2E_MNEMONIC and SPARK_E2E_PAYER_MNEMONIC (environment
#   secrets) and the variable E2E_LIGHTNING_ADDRESS only after they approve the run. One funded run
#   at a time, and a newer run waits instead of cancelling it, because every run shares the same
#   wallets. No artifacts, no retries.
on: [pull_request]

permissions:
  contents: read

jobs:
  detox:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    concurrency:
      group: e2e-android-${{ github.ref }}
      cancel-in-progress: true

    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/detox-build
        with:
          breez-api-key: ${{ secrets.BREEZ_API_KEY }}

      - name: Run Detox
        env:
          BREEZ_API_KEY: ${{ secrets.BREEZ_API_KEY }}
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel
          avd-name: Pixel_API_29_AOSP
          force-avd-creation: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -camera-front none -partition-size 4096
          script: ./tests/e2e/run-ci.sh unfunded "${{ github.workspace }}/artifacts"

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: detox-artifacts
          path: artifacts
          retention-days: 7

  detox-funded:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    environment: e2e-funded
    concurrency:
      group: e2e-android-funded
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/detox-build
        with:
          breez-api-key: ${{ secrets.BREEZ_API_KEY_PRD }}
          env-file: .env.prd

      - name: Run Detox
        env:
          E2E_ENV_FILE: .env.prd
          BREEZ_API_KEY: ${{ secrets.BREEZ_API_KEY_PRD }}
          HD_MNEMONIC_BIP84: ${{ secrets.HD_MNEMONIC_BIP84 }}
          SPARK_E2E_MNEMONIC: ${{ secrets.SPARK_E2E_MNEMONIC }}
          SPARK_E2E_PAYER_MNEMONIC: ${{ secrets.SPARK_E2E_PAYER_MNEMONIC }}
          E2E_LIGHTNING_ADDRESS: ${{ vars.E2E_LIGHTNING_ADDRESS }}
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel
          avd-name: Pixel_API_29_AOSP
          force-avd-creation: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -camera-front none -partition-size 4096
          script: ./tests/e2e/run-ci.sh funded

name: Tests e2e Android

# Detox on an Android emulator against a release build. Not a required check yet.
# Secrets: BREEZ_API_KEY (Spark), HD_MNEMONIC_BIP84 (funded on-chain wallet),
# SPARK_E2E_MNEMONIC (on-chain phrase whose Spark wallet holds a few hundred sats).
# Variable: E2E_LIGHTNING_ADDRESS (Lightning address the send tests request invoices from).
# Suites whose inputs are missing fail instead of skipping. Nothing is broadcast or paid.
on: [pull_request]

permissions:
  contents: read

concurrency:
  group: e2e-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detox:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      HD_MNEMONIC_BIP84: ${{ secrets.HD_MNEMONIC_BIP84 }}
      SPARK_E2E_MNEMONIC: ${{ secrets.SPARK_E2E_MNEMONIC }}
      E2E_LIGHTNING_ADDRESS: ${{ vars.E2E_LIGHTNING_ADDRESS }}

    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /usr/local/lib/android/sdk/ndk
          sudo docker system prune -af || true
          df -h /

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('android/**/*.gradle', 'android/**/*.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Install dependencies
        run: npm ci

      - name: Build release and test APKs
        env:
          BREEZ_API_KEY: ${{ secrets.BREEZ_API_KEY }}
        run: npm run e2e:release-build

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run Detox
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel
          avd-name: Pixel_API_29_AOSP
          force-avd-creation: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -camera-front none -partition-size 4096
          script: npm run e2e:release-test -- --artifacts-location "${{ github.workspace }}/artifacts"

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: detox-artifacts
          path: artifacts
          retention-days: 7

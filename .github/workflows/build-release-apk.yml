name: BuildReleaseApk

on:
  push:
    tags:
      - 'v*' # This triggers the workflow on any tag starting with 'v'

jobs:
  buildReleaseApk:
    name: Build release APK/AAB
    runs-on: macos-15
    env:
      BUNDLETOOL_VERSION: 1.18.3

    permissions:
      contents: write
      actions: read
      id-token: write
      attestations: write

    steps:
      - name: Checkout project
        uses: actions/checkout@v4
        with:
          fetch-depth: '0'

      - name: Specify node version
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Use npm caches
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Use specific Java version for sdkmanager to work
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Install node_modules
        run: npm ci --omit=dev

      - name: Install pinned bundletool
        run: bash ./.github/scripts/install-bundletool.sh

      - name: Extract version name
        run: |
          VERSION_NAME=$(grep versionName android/app/build.gradle | awk '{print $2}' | tr -d '"')
          echo "VERSION_NAME=$VERSION_NAME" >> $GITHUB_ENV

      - name: Build
        env:
          KEYSTORE_FILE_HEX: ${{ secrets.KEYSTORE_FILE_HEX }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEYSTORE_KEY_PASSWORD: ${{ secrets.KEYSTORE_KEY_PASSWORD }}
          KEYSTORE_ALIAS: ${{ secrets.KEYSTORE_ALIAS }}
          TRANSPARENCY_KEYSTORE_HEX: ${{ secrets.TRANSPARENCY_KEYSTORE_HEX }}
          TRANSPARENCY_PASSWORD: ${{ secrets.TRANSPARENCY_PASSWORD }}
          TRANSPARENCY_ALIAS: ${{ secrets.TRANSPARENCY_ALIAS }}
        run: ./scripts/build-release-apk.sh

      - name: Prepare release assets and checksums
        run: bash ./.github/scripts/prepare-release-assets.sh

      - name: Attest APK
        uses: actions/attest@v4
        with:
          subject-path: ./android/app/build/outputs/apk/release/app-release.apk

      - name: Attest APK signature
        uses: actions/attest@v4
        with:
          subject-path: ./android/app/build/outputs/apk/release/app-release.apk.idsig

      - name: Attest AAB
        uses: actions/attest@v4
        with:
          subject-path: ./android/app/build/outputs/bundle/release/app-release-transparent.aab

      - name: Attest transparency certificate
        uses: actions/attest@v4
        with:
          subject-path: ./android/app/build/outputs/bundle/release/transparency-cert.pem

      - name: Attest checksums
        uses: actions/attest@v4
        with:
          subject-path: ${{ env.RELEASE_ASSETS_DIR }}/SHA256SUMS

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: DFX-Btc-Wallet-${{ env.VERSION_NAME }}.apk
          path: ./android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Add build pipeline link to release body
        uses: actions/github-script@v7
        with:
          github-token: ${{ github.token }}
          script: |
            const updateReleaseBody = require('./.github/scripts/update-release-body.js');
            await updateReleaseBody({ github, context });

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${GITHUB_REF_NAME}" \
            "${RELEASE_ASSETS_DIR}/DFX-Btc-Wallet-${GITHUB_REF_NAME}.apk" \
            "${RELEASE_ASSETS_DIR}/DFX-Btc-Wallet-${GITHUB_REF_NAME}.apk.idsig" \
            "${RELEASE_ASSETS_DIR}/DFX-Btc-Wallet-${GITHUB_REF_NAME}.aab" \
            "${RELEASE_ASSETS_DIR}/DFX-Btc-Wallet-${GITHUB_REF_NAME}-transparency-cert.pem" \
            "${RELEASE_ASSETS_DIR}/SHA256SUMS" \
            --clobber

# PR check: build handbook image (no push) and run container smoke tests.
# Draft PRs are skipped; ready_for_review re-triggers the check.

name: Handbook Build Check

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'docs/**'
      - 'scripts/handbook/**'
      - 'android/fastlane/metadata/**'
      - 'ios/fastlane/metadata/**'
      - 'img/dfx/**'
      - 'img/icon*.png'
      - '*.md'
      - 'Dockerfile.handbook'
      - 'handbook.nginx.conf'
      - '.github/workflows/handbook-deploy.yaml'
      - '.github/workflows/handbook-check.yaml'

permissions:
  contents: read

concurrency:
  group: handbook-check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build-and-smoke:
    name: Build handbook image + container smoke
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 25
    steps:
      - name: Checkout
        # SHA verified via gh api repos/actions/checkout/commits/v7.0.1
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Docker Buildx
        # SHA verified via gh api repos/docker/setup-buildx-action/commits/v4.2.0
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Build handbook image (no push)
        # SHA verified via gh api repos/docker/build-push-action/commits/v7.3.0
        # v7 requires Actions Runner ≥ v2.327.1 (Node 24). Inputs we use
        # (context/file/push/load/tags/platforms/build-args) are unchanged from v6.
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: ./Dockerfile.handbook
          push: false
          load: true
          tags: dfx-taro-handbook:pr-check
          platforms: linux/arm64
          build-args: |
            GIT_SHA=${{ github.sha }}

      # Gate: image must contain the same artifact counts as a host-side build.
      # Catches Dockerfile COPY drift (hardcoded name lists that omit new
      # top-level *.md or img/icon*.png while build.js discovery still sees them).
      # Uses the runner's preinstalled Node (ubuntu-24.04-arm) — no setup-node
      # pin needed for this comparison.
      - name: Host vs image artifact counts
        run: |
          set -euo pipefail
          node --version
          npm install --prefix ./_handbook-deps --no-save --no-audit --no-fund marked@15.0.7
          NODE_PATH=./_handbook-deps/node_modules \
            node scripts/handbook/build.js /tmp/handbook-host-out
          # Extract baked manifest without starting the container.
          cid=$(docker create dfx-taro-handbook:pr-check)
          docker cp "$cid:/usr/share/nginx/html/manifest.json" /tmp/handbook-image-manifest.json
          docker rm "$cid" >/dev/null
          node <<'NODE'
          const fs = require('fs');
          const CATS = ['screenshots', 'docs', 'store', 'assets'];

          function fail(msg) {
            console.error(msg);
            process.exit(1);
          }

          // Per-side foundation checks: two empty or broken manifests must never
          // compare equal. Vacuous pass (both sides 0 / missing artifacts) is a
          // failure of the gate, not a green check.
          function countsForSide(label, m) {
            if (!m || typeof m !== 'object' || Array.isArray(m)) {
              fail(`handbook host/image: ${label} manifest is not an object`);
            }
            if (!Object.prototype.hasOwnProperty.call(m, 'artifacts')) {
              fail(`handbook host/image: ${label} artifacts missing`);
            }
            if (!Array.isArray(m.artifacts)) {
              fail(
                `handbook host/image: ${label} artifacts is not an array ` +
                  `(got ${typeof m.artifacts})`,
              );
            }
            if (m.artifacts.length === 0) {
              fail(`handbook host/image: ${label} artifacts is empty`);
            }

            let by;
            if (
              Object.prototype.hasOwnProperty.call(m, 'counts') &&
              m.counts !== null &&
              typeof m.counts === 'object' &&
              !Array.isArray(m.counts)
            ) {
              by = {};
              for (const c of CATS) {
                if (!Object.prototype.hasOwnProperty.call(m.counts, c)) {
                  fail(
                    `handbook host/image: ${label} counts.${c} missing`,
                  );
                }
                const v = m.counts[c];
                if (typeof v !== 'number' || !Number.isFinite(v) || !Number.isInteger(v) || v < 0) {
                  fail(
                    `handbook host/image: ${label} counts.${c} is not a ` +
                      `non-negative integer (got ${JSON.stringify(v)})`,
                  );
                }
                by[c] = v;
              }
            } else {
              by = { screenshots: 0, docs: 0, store: 0, assets: 0 };
              for (const a of m.artifacts) {
                if (!a || typeof a !== 'object') continue;
                if (a.category === 'screenshot') by.screenshots += 1;
                else if (a.category === 'doc') by.docs += 1;
                else if (a.category === 'store') by.store += 1;
                else if (a.category === 'asset') by.assets += 1;
              }
            }

            const sum = CATS.reduce((s, c) => s + by[c], 0);
            if (sum === 0) {
              fail(
                `handbook host/image: ${label} sum of category counts is 0`,
              );
            }
            return by;
          }

          const host = JSON.parse(
            fs.readFileSync('/tmp/handbook-host-out/manifest.json', 'utf8'),
          );
          const image = JSON.parse(
            fs.readFileSync('/tmp/handbook-image-manifest.json', 'utf8'),
          );
          const h = countsForSide('host', host);
          const i = countsForSide('image', image);

          let bad = false;
          for (const c of CATS) {
            // Both sides always have every category as a number after
            // countsForSide — missing keys cannot slip through as undefined===undefined.
            if (h[c] !== i[c]) {
              console.error(
                `handbook host/image drift: category=${c} host=${h[c]} image=${i[c]}`,
              );
              bad = true;
            }
          }
          if (bad) {
            console.error(
              'Image artifact counts differ from host build — check Dockerfile COPY ' +
                'globs/directories (hardcoded name lists omit new files silently).',
            );
            process.exit(1);
          }
          NODE

      - name: Container smoke (public handbook, healthz, manifest sample)
        run: |
          set -euo pipefail
          docker rm -f handbook-smoke >/dev/null 2>&1 || true
          # No credentials — handbook is public; image must start without them.
          docker run -d --name handbook-smoke -p 8080:8080 \
            dfx-taro-handbook:pr-check

          for i in $(seq 1 20); do
            if curl -fsS --max-time 3 http://127.0.0.1:8080/healthz 2>/dev/null | grep -q OK; then
              break
            fi
            sleep 1
          done

          body=$(curl -fsS --max-time 5 http://127.0.0.1:8080/healthz)
          echo "$body" | grep -q OK

          # Public root: 200 without credentials. This is the line that fails
          # if an auth wall is reintroduced (401) — do not drop it.
          code=$(curl -sS -o /dev/null -w '%{http_code}' -L --max-time 5 http://127.0.0.1:8080/)
          if [ "$code" != "200" ]; then
            echo "expected 200 from / unauthenticated, got $code" >&2
            docker logs handbook-smoke >&2 || true
            exit 1
          fi

          # Sample one artifact per category from the generated manifest
          # (no hard-coded filenames — renames must not break this check).
          docker cp handbook-smoke:/usr/share/nginx/html/manifest.json /tmp/handbook-manifest.json
          node <<'NODE'
          const fs = require('fs');
          const m = JSON.parse(fs.readFileSync('/tmp/handbook-manifest.json', 'utf8'));
          if (!m.artifacts || !m.artifacts.length) {
            console.error('manifest has no artifacts');
            process.exit(1);
          }
          const byCat = {};
          for (const a of m.artifacts) {
            if (!byCat[a.category]) byCat[a.category] = a;
          }
          const paths = Object.values(byCat)
            .map((a) => a.outputPath)
            .filter((p) => p && p !== 'index.html');
          // Always include index.html as a public page sample
          paths.unshift('index.html');
          // Encode per segment: a filename may legitimately contain '#' or '?',
          // which curl would otherwise read as fragment/query and cut the path short.
          const encoded = paths.map((p) => p.split('/').map(encodeURIComponent).join('/'));
          fs.writeFileSync('/tmp/handbook-sample-paths.txt', encoded.join('\n') + '\n');
          NODE

          while IFS= read -r path; do
            [ -n "$path" ] || continue
            code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 10 \
              "http://127.0.0.1:8080/${path}")
            # Anything outside 2xx is a failure. Checking only for 404 let a 401,
            # 403 or 500 pass as if the artifact were served correctly.
            case "$code" in
              2*) echo "ok ${code} ${path}" ;;
              *)
                echo "artifact sample ${code}: ${path}" >&2
                docker logs handbook-smoke >&2 || true
                exit 1
                ;;
            esac
          done < /tmp/handbook-sample-paths.txt

          docker stop handbook-smoke
          docker rm handbook-smoke

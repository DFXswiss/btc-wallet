name: Deploy (develop)

# On every merge to develop: build a signed Android APK and upload it as a
# workflow artifact for quick install/testing. iOS TestFlight and the versioned
# store releases are owned by the tag flow (auto-tag.yml -> release.yml); this
# workflow intentionally does not build iOS to avoid a duplicate TestFlight upload.
#
# Required repository secrets:
#   KEYSTORE_FILE_HEX, KEYSTORE_PASSWORD, KEYSTORE_KEY_PASSWORD, KEYSTORE_ALIAS
#   SENTRY_AUTH_TOKEN (required: a missing token fails this build intentionally,
#   rather than silently shipping without crash symbolication). SENTRY_URL/ORG/
#   PROJECT aren't secrets (see below) but sentry-cli needs all of it together.
#   BREEZ_API_KEY (required: baked into the APK via a generated overlay .env).

on:
  push:
    branches: [develop]
  workflow_dispatch:

concurrency:
  group: deploy-develop
  cancel-in-progress: false # let each merge's APK build finish

permissions:
  contents: read

jobs:
  android-apk:
    name: Android APK
    # Ubuntu: faster + cheaper than macOS for Android. The RN postinstall must
    # run (JS-bundle shims + patch-package), but its pod-install step is
    # Mac-guarded (scripts/podinstall.sh -> darwin* only), so it no-ops here.
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Install node_modules
        run: npm ci --omit=dev
      - name: Build signed release APK (.env.prd)
        env:
          KEYSTORE_FILE_HEX: ${{ secrets.KEYSTORE_FILE_HEX }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEYSTORE_KEY_PASSWORD: ${{ secrets.KEYSTORE_KEY_PASSWORD }}
          KEYSTORE_ALIAS: ${{ secrets.KEYSTORE_ALIAS }}
          BUILD_NUMBER: ${{ github.run_number }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_URL: https://sentry.dfxserve.com/
          SENTRY_ORG: sentry
          SENTRY_PROJECT: btc-taro
          BREEZ_API_KEY: ${{ secrets.BREEZ_API_KEY }}
        run: |
          set -euo pipefail
          for var in SENTRY_AUTH_TOKEN SENTRY_URL SENTRY_ORG SENTRY_PROJECT BREEZ_API_KEY; do
            [ -n "${!var:-}" ] || { echo "Missing required env: $var" >&2; exit 1; }
          done
          KS="$(mktemp /tmp/app-signing.XXXXXX.keystore)"; chmod 600 "$KS"
          BREEZ_ENVFILE="$(mktemp /tmp/breez-env.XXXXXX)"; chmod 600 "$BREEZ_ENVFILE"
          cleanup() {
            for f in "$KS" "$BREEZ_ENVFILE"; do
              [ -f "$f" ] || continue
              if command -v shred &>/dev/null; then shred -u "$f"; else rm -Pf "$f"; fi
            done
          }
          trap cleanup EXIT INT TERM
          # .env.prd has no trailing newline; leading \n keeps BREEZ_API_KEY on its own line.
          cp .env.prd "$BREEZ_ENVFILE"
          printf '\nBREEZ_API_KEY=%s\n' "$BREEZ_API_KEY" >> "$BREEZ_ENVFILE"
          printf '%s' "$KEYSTORE_FILE_HEX" | xxd -plain -revert > "$KS"
          cd android
          ENVFILE="$BREEZ_ENVFILE" ./gradlew assembleRelease \
            -PMYAPP_UPLOAD_STORE_FILE="$KS" \
            -PMYAPP_UPLOAD_KEY_ALIAS="$KEYSTORE_ALIAS" \
            -PMYAPP_UPLOAD_STORE_PASSWORD="$KEYSTORE_PASSWORD" \
            -PMYAPP_UPLOAD_KEY_PASSWORD="$KEYSTORE_KEY_PASSWORD" \
            -PMYAPP_VERSION_CODE="$BUILD_NUMBER"
      - uses: actions/upload-artifact@v4
        with:
          name: dfx-bitcoin-develop-${{ github.run_number }}
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
